<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact form detection</title>
  </head>
  <body>
    <!-- Standalone form page so Netlify detects the contact form at build time -->
    <form
      name="contact"
      method="POST"
      action="/"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
